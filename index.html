<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Chongfu Connect HelpBot"
  />

  <title>Chongfu Connect HelpBot</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <main class="chat-app">

    <!-- Compact chatbot header -->
    <header class="chat-header">

      <div class="header-left">

        <div
          class="header-avatar"
          aria-hidden="true"
        >
          🤖
        </div>

        <div class="header-text">

          <h1>
            Chongfu Connect Assistant
          </h1>

          <p>
            ICT &amp; Admin HelpBot
          </p>

        </div>

      </div>

      <button
        id="resetButton"
        class="reset-button"
        type="button"
        aria-label="Start a new enquiry"
        title="Start a new enquiry"
      >
        ↻
      </button>

    </header>


    <!-- Google Sheet connection status -->
    <div
      id="statusBar"
      class="status-bar"
      role="status"
      aria-live="polite"
    >
      Connecting to the FAQ sheet…
    </div>


    <!-- Chat conversation area -->
    <section
      id="chatMessages"
      class="chat-messages"
      aria-live="polite"
      aria-label="Chat conversation"
    >

      <div class="message-row bot-row welcome-row">

        <div
          class="message-avatar"
          aria-hidden="true"
        >
          🤖
        </div>

        <div class="message bot-message">

          <p>
            <strong>
              Need help with something at Chongfu? Just ask!
            </strong>
          </p>

          <p class="suggestion-heading">
            Try asking about:
          </p>

          <div class="starter-buttons">

            <button
              class="starter-button"
              type="button"
              data-query="Cockpit parent contact"
            >
              Cockpit parent contact
            </button>

            <button
              class="starter-button"
              type="button"
              data-query="Extra assessment copies"
            >
              Extra assessment copies
            </button>

            <button
              class="starter-button"
              type="button"
              data-query="SLS login"
            >
              SLS login
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- Help note -->
    <div class="help-note">

      <span aria-hidden="true">
        💡
      </span>

      <span>
        Try using a shorter phrase or a key term if no answer is found.
      </span>

    </div>


    <!-- Chat input -->
    <form
      id="chatForm"
      class="chat-input-area"
    >

      <label
        class="screen-reader-only"
        for="questionInput"
      >
        Type your question
      </label>

      <input
        id="questionInput"
        type="text"
        autocomplete="off"
        maxlength="300"
        placeholder="Type your question here…"
        required
      />

      <button
        id="sendButton"
        class="send-button"
        type="submit"
        aria-label="Send question"
      >
        ➤
      </button>

    </form>

  </main>


  <script src="script.js"></script>

</body>
</html>
